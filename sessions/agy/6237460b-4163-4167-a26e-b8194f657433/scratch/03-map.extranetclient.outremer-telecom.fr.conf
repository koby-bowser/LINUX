# HTTPS Centreon MAP
server {
    listen              172.30.198.33:9443 ssl http2;
    listen              109.62.64.18:9443 ssl http2;
    server_name         map.extranetclient.outremer-telecom.fr 109.62.64.18;

    # SSL (certificat dédié Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/map.extranetclient.outremer-telecom.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.extranetclient.outremer-telecom.fr/privkey.pem;

    # security
    include             nginxconfig.io/security.conf;

    # logging
    access_log          /var/log/nginx/map.extranetclient.outremer-telecom.fr-access.log;
    error_log           /var/log/nginx/map.extranetclient.outremer-telecom.fr-error.log warn;

    # Redirection explicite racine -> /centreon-map/
    location = / {
        return 301 /centreon-map/;
    }

    # reverse proxy vers Map (Tomcat HTTPS sur port 9443)
    location / {
        proxy_pass                 https://172.30.198.50:9443;
        proxy_ssl_verify           off;

        include                    nginxconfig.io/proxy.conf;
        proxy_set_header Host      $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl   on;
        proxy_set_header X-Forwarded-Port  9443;

        proxy_redirect             http:// https://;
        proxy_headers_hash_max_size   1024;
        proxy_headers_hash_bucket_size 128;
    }

    # additional config
    include nginxconfig.io/general.conf;
}
