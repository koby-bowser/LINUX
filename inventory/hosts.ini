# Inventaire Ansible — koby-bowser-ansible
#
# Groupe local : ce nœud de contrôle lui-même, en connexion locale (pas de SSH).
[control_node]
localhost ansible_connection=local

# ------------------------------------------------------------------------------
# Cluster WEXTP — Front-Ends (Nginx Reverse Proxies & TLS Termination)
# ------------------------------------------------------------------------------
[wextp_frontends]
trp-wextp-fe1 ansible_host=172.30.230.97 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-fe2 ansible_host=172.30.230.98 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-fe3 ansible_host=172.30.230.99 ansible_port=30 ansible_user=koby-bowser-ansible

# ------------------------------------------------------------------------------
# Cluster WEXTP — Back-Ends (PHP-FPM Pools, ProxySQL & Application Webroots)
# ------------------------------------------------------------------------------
[wextp_backends]
trp-wextp-be1  ansible_host=172.30.230.113 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be2  ansible_host=172.30.230.114 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be3  ansible_host=172.30.230.115 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be4  ansible_host=172.30.230.116 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be5  ansible_host=172.30.230.117 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be6  ansible_host=172.30.230.118 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be7  ansible_host=172.30.230.119 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be8  ansible_host=172.30.230.120 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be9  ansible_host=172.30.230.121 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be10 ansible_host=172.30.230.122 ansible_port=30 ansible_user=koby-bowser-ansible
trp-wextp-be11 ansible_host=172.30.230.123 ansible_port=30 ansible_user=koby-bowser-ansible

[wextp:children]
wextp_frontends
wextp_backends

[wextp:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
ansible_python_interpreter=/usr/bin/python3

# ------------------------------------------------------------------------------
# Cluster IP-FTTH — Kea DHCP Front-Ends
# ------------------------------------------------------------------------------
[ipftth_frontends]
mtq-ipftthp-fe3 ansible_host=10.2.41.226 ansible_port=30 ansible_user=admin

[ipftth:children]
ipftth_frontends

[ipftth:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
