---
# ==============================================================================
# Playbook: check-kea.yml
# Purpose: Inspect the status, processes, sockets, configuration, REST API, and
#          metrics of the ISC Kea DHCP suite (kea-dhcp4, kea-ctrl-agent) on
#          mtq-ipftthp-fe3 (10.2.41.226:30) via passwordless SSH public key auth.
#
# Note on Compatibility:
#   Target host runs RHEL 8 (el8) with platform-python 3.6.8. All inspection tasks
#   use ansible.builtin.raw to execute directly over SSH without depending on
#   a modern remote Python runtime (bypassing PEP 563 annotations incompatibility).
#
# Execution:
#   ansible-playbook check-kea.yml
# ==============================================================================

- name: Vérifier l'état du processus et des services ISC Kea DHCP
  hosts: "{{ target_hosts | default('ipftth_frontends' if 'ipftth_frontends' in groups else 'all') }}"
  gather_facts: false

  vars:
    ansible_user: "{{ target_user | default('admin') }}"
    ansible_port: "{{ target_port | default(30) }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o PreferredAuthentications=publickey
    kea_api_url: "http://172.30.38.212:8000/"

  tasks:
    # --------------------------------------------------------------------------
    # 1. ISC Kea Control Agent REST API Queries (Direct & Authoritative)
    # --------------------------------------------------------------------------
    - name: "Interroger le statut du serveur DHCPv4 via l'API REST Kea (status-get)"
      ansible.builtin.raw: >-
        curl -s -m 5 -X POST -H "Content-Type: application/json"
        -d '{"command": "status-get", "service": ["dhcp4"]}' {{ kea_api_url }}
      register: _kea_api_status
      changed_when: false
      failed_when: false

    - name: "Interroger la version et les backends de Kea via l'API REST (version-get)"
      ansible.builtin.raw: >-
        curl -s -m 5 -X POST -H "Content-Type: application/json"
        -d '{"command": "version-get", "service": ["dhcp4"]}' {{ kea_api_url }}
      register: _kea_api_version
      changed_when: false
      failed_when: false

    - name: "Interroger les statistiques DHCPv4 globales (statistic-get-all)"
      ansible.builtin.raw: >-
        curl -s -m 5 -X POST -H "Content-Type: application/json"
        -d '{"command": "statistic-get-all", "service": ["dhcp4"]}' {{ kea_api_url }}
      register: _kea_api_stats
      changed_when: false
      failed_when: false

    # --------------------------------------------------------------------------
    # 2. Network Listening Sockets (UDP 67 DHCP, TCP 8000 Control Agent)
    # --------------------------------------------------------------------------
    - name: Vérifier les sockets réseau UDP en écoute (Port 67 DHCPv4)
      ansible.builtin.raw: >-
        ss -u -l -n sport = :bootps 2>&1
      register: _kea_udp_sockets
      changed_when: false
      failed_when: false

    - name: Vérifier les sockets réseau TCP en écoute (Port 8000 Control Agent, 9547 Exporter)
      ansible.builtin.raw: >-
        ss -t -l -n 'sport = :8000 or sport = :9547 or sport = :8080' 2>&1
      register: _kea_tcp_sockets
      changed_when: false
      failed_when: false

    - name: Vérifier les sockets UNIX de contrôle locaux (/var/run/kea)
      ansible.builtin.raw: >-
        ls -la /var/run/kea/ 2>&1
      register: _kea_unix_sockets
      changed_when: false
      failed_when: false

    # --------------------------------------------------------------------------
    # 3. Process & keactrl Status
    # --------------------------------------------------------------------------
    - name: Exécuter le script de statut officiel keactrl
      ansible.builtin.raw: >-
        /usr/local/sbin/keactrl status 2>&1
      register: _keactrl_status
      changed_when: false
      failed_when: false

    # --------------------------------------------------------------------------
    # 4. Configuration Files & Binaries
    # --------------------------------------------------------------------------
    - name: Vérifier les binaires installés et leur chemin
      ansible.builtin.raw: >-
        for bin in kea-dhcp4 kea-dhcp6 kea-ctrl-agent keactrl; do
          path=$(command -v "$bin" 2>/dev/null || ls /usr/local/sbin/"$bin" 2>/dev/null || true)
          echo "$bin: $path"
        done
      register: _kea_binaries
      changed_when: false
      failed_when: false

    - name: Lister les fichiers de configuration Kea dans /usr/local/etc/kea/
      ansible.builtin.raw: >-
        ls -lh /usr/local/etc/kea/ 2>&1
      register: _kea_configs
      changed_when: false
      failed_when: false

    # --------------------------------------------------------------------------
    # 5. Diagnostic Summary
    # --------------------------------------------------------------------------
    - name: "=== RAPPORT D'ÉTAT DU PROCESSUS ET DU SERVICE ISC KEA DHCP ==="
      ansible.builtin.debug:
        msg:
          - "===================================================================="
          - "HÔTE CIBLE : {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }}:{{ ansible_port }})"
          - "UTILISATEUR: {{ ansible_user }} (Authentification par clé SSH publique)"
          - "===================================================================="
          - "--- STATUT DU DÉMON DHCPv4 (API REST KEA status-get) ---"
          - "{{ _kea_api_status.stdout_lines | default(['API non joignable']) }}"
          - "--- VERSION ET MODULES KEA (API REST version-get) ---"
          - "{{ _kea_api_version.stdout_lines | default(['Version non disponible']) }}"
          - "--- SOCKETS RÉSEAU UDP (DHCPv4 :67) ---"
          - "{{ _kea_udp_sockets.stdout_lines | default(['Aucun socket UDP']) }}"
          - "--- SOCKETS RÉSEAU TCP (API REST :8000, Exporter :9547) ---"
          - "{{ _kea_tcp_sockets.stdout_lines | default(['Aucun socket TCP']) }}"
          - "--- FICHIERS DE CONTRÔLE ET SOCKETS UNIX (/var/run/kea) ---"
          - "{{ _kea_unix_sockets.stdout_lines | default(['Aucun socket UNIX']) }}"
          - "--- STATUT DU SCRIPT DE GESTION KEA (keactrl status) ---"
          - "{{ _keactrl_status.stdout_lines | default(['keactrl non exécuté']) }}"
          - "--- BINAIRES INSTALLÉS (/usr/local/sbin/) ---"
          - "{{ _kea_binaries.stdout_lines | default(['Binaires non trouvés']) }}"
          - "--- FICHIERS DE CONFIGURATION DISPONIBLES (/usr/local/etc/kea/) ---"
          - "{{ _kea_configs.stdout_lines | default(['Répertoire introuvable']) }}"
          - "===================================================================="
